<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="100%" height="150">
  <defs>
    <!-- Градиент фона карточки -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d2a"/>
      <stop offset="50%" stop-color="#12151e"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Свечение слева -->
    <radialGradient id="glow-left" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Свечение справа -->
    <radialGradient id="glow-right" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Скругление для аватара -->
    <clipPath id="avatar-clip">
      <circle cx="68" cy="75" r="36"/>
    </clipPath>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #8b949e;
    }
    .btn-bg {
      fill: #161b22;
      stroke: rgba(255, 255, 255, 0.09);
      stroke-width: 1;
      rx: 8;
      transition: all 0.2s;
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #c9d1d9;
    }
    .badge-bg {
      fill: rgba(255, 255, 255, 0.08);
      rx: 3;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      fill: #8b949e;
      font-weight: 600;
    }
  </style>

  <!-- Основная карточка -->
  <rect x="1" y="1" width="718" height="148" rx="16" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  
  <!-- Фоновые неоновые блики -->
  <rect x="1" y="1" width="718" height="148" rx="16" fill="url(#glow-left)" pointer-events="none"/>
  <rect x="1" y="1" width="718" height="148" rx="16" fill="url(#glow-right)" pointer-events="none"/>

  <!-- Аватар -->
  <g>
    <image href="data:image/jpeg;base64," x="32" y="39" width="72" height="72" clip-path="url(#avatar-clip)"/>
    <circle cx="68" cy="75" r="36" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2"/>
  </g>

  <!-- Name and tag -->
  <g transform="translate(122, 0)">
    <text x="0" y="69" class="name-text">iwtsd</text>
    <text x="0" y="93" class="sub-text">@iwtsyddd</text>
  </g>

  <!-- Кнопки соцсетей справа (теги) -->
  <g transform="translate(480, 0)">
    <!-- 1. Telegram Личный -->
    <g transform="translate(0, 22)">
      <rect x="0" y="0" width="208" height="30" class="btn-bg"/>
      <svg x="9" y="7" width="16" height="16" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z" fill="#ffffff"/>
      </svg>
      <text x="32" y="19" class="btn-text" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">@ikikikikikikikikikkiki</text>
    </g>

    <!-- 2. Telegram Канал -->
    <g transform="translate(0, 59)">
      <rect x="0" y="0" width="208" height="30" class="btn-bg"/>
      <svg x="9" y="7" width="16" height="16" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z" fill="#ffffff"/>
      </svg>
      <text x="32" y="19" class="btn-text" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">@iwtsdev</text>
    </g>

    <!-- 3. Discord -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="208" height="30" class="btn-bg"/>
      <svg x="9" y="7" width="16" height="16" viewBox="0 0 24 24">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="#ffffff"/>
      </svg>
      <text x="32" y="19" class="btn-text" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">@iwtsd</text>
    </g>
  </g>
</svg>
