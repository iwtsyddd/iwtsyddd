<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="720" height="150" viewBox="0 0 720 150"
     role="img" aria-labelledby="socksicle-title socksicle-desc">
  <title id="socksicle-title">Socksicle</title>
  <desc id="socksicle-desc">Open-source cross-platform proxy and VPN client. Visit Socksicle on GitHub.</desc>

  <defs>
    <clipPath id="banner-clip">
      <rect x="1.5" y="1.5" width="717" height="147" rx="23.25"/>
    </clipPath>
  </defs>

  <!-- Main surface -->
  <rect x="1.5" y="1.5" width="717" height="147" rx="24"
        fill="#19161F"/>

  <g clip-path="url(#banner-clip)">
    <!-- A restrained tonal field gives the mark its own visual space. -->
    <path d="M615 -8
             C584 1 559 20 548 49
             C536 85 552 127 584 158
             H728 V-8 Z"
          fill="#241E2D"/>

    <!-- Brand mark container -->
    <rect x="584" y="24" width="104" height="104" rx="28"
          fill="#E8DEF8" stroke="#806E9F" stroke-width="1.5"/>

    <!-- Exact geometry and original brand colors from the supplied icon.svg. -->
    <svg x="588" y="28" width="96" height="96" viewBox="0 0 128 128"
         aria-hidden="true">
      <path d="M34 10 L78 21 L102 38 L56 38 L38 56 L12 56 L24 29 Z"
            fill="#6750A4"/>
      <path d="M112 54 L55 54 L38 72 L18 72 L26 84 L47 95 L65 119 L82 80 L98 60 Z"
            fill="#4B3FA3"/>
    </svg>
  </g>

  <!-- Project identity -->
  <g font-family="Roboto, 'Inter', 'Segoe UI', Arial, sans-serif">
    <text x="32" y="32"
          fill="#D0BCFF" font-size="10.5" font-weight="700"
          letter-spacing="1.35">OPEN-SOURCE DESKTOP CLIENT</text>

    <text x="32" y="64"
          fill="#F4EFF7" font-size="31" font-weight="700"
          letter-spacing="-0.7">Socksicle</text>

    <text x="32" y="88"
          fill="#CAC3D1" font-size="13.5" font-weight="400"
          letter-spacing="0.02">Cross-platform proxy / VPN client with Material 3 UI</text>

    <a xlink:href="https://github.com/Socksicle/desktop"
       href="https://github.com/Socksicle/desktop"
       target="_blank" rel="noopener noreferrer">
      <rect x="32" y="104" width="240" height="32" rx="16"
            fill="#30283A" stroke="#63566F" stroke-width="1"/>
      <circle cx="52" cy="120" r="4" fill="#D0BCFF"/>
      <text x="64" y="124"
            fill="#EADDFF" font-size="11.5" font-weight="600"
            letter-spacing="0.1">github.com/Socksicle/desktop</text>
      <path d="M254 120 H261 M257 116 L261 120 L257 124"
            fill="none" stroke="#D0BCFF" stroke-width="1.25"
            stroke-linecap="round" stroke-linejoin="round"/>
    </a>
  </g>

  <!-- One continuous, high-contrast perimeter outline. -->
  <rect x="1.25" y="1.25" width="717.5" height="147.5" rx="24"
        fill="none" stroke="#6E647A" stroke-width="1.5"/>
</svg>
